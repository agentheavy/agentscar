# PyPI thin launcher: ships bin/agentscar (bash) as package data and execs it.
# Packaging metadata only — the tool itself has zero runtime dependencies.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentscar"
version = "0.1.2"
description = "Blameless postmortems for your coding agent. Auto-memory remembers — it doesn't learn."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
keywords = ["postmortem", "coding-agent", "ai-agents", "guardrails", "claude-code", "cli"]

[project.urls]
Homepage = "https://github.com/agentheavy/agentscar"
Repository = "https://github.com/agentheavy/agentscar"

[project.scripts]
agentscar = "agentscar:main"

[tool.hatch.build.targets.wheel.force-include]
"bin/agentscar" = "agentscar/agentscar.sh"

[tool.hatch.build.targets.sdist]
include = ["src", "bin", "README.md", "LICENSE"]
